  <!-- Ben -->
  <line x1="30" y1="43.5" x2="30" y2="49" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="36" y1="43.5" x2="36" y2="49" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
